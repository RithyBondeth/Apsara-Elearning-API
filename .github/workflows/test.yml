name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Unit tests are fully mocked (no Postgres/RabbitMQ); test/setup-env.ts
      # supplies the env the config schema requires.
      - run: npm ci
      - run: npm test
