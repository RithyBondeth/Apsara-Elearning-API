name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Unit tests are fully mocked (no Postgres/RabbitMQ); test/setup-env.ts
      # supplies the env the config schema requires.
      - run: npm ci
      - run: npm test

  # What the mocked unit tests can't see: migrations, and SQL run for real.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration check builds the base branch's schema from history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Base = main as this PR would merge into it; on a push to main, the
      # previous main. Fails if migrating that schema doesn't produce exactly
      # the schema libs/database/src/schemas declares.
      - name: Migrations upgrade main to exactly the declared schema
        run: npm run db:check-migrations -- --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}

      - name: Integration tests (real Postgres)
        run: npm run test:int
