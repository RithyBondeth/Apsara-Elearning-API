services:
  postgres:
    image: postgres:16-alpine
    container_name: apsara-elearning-postgres

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: apsara
      POSTGRES_PASSWORD: apsara123
      POSTGRES_DB: apsara_elearning

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: apsara-elearning-rabbitmq

    ports:
      - '5672:5672'
      - '15672:15672'

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

    restart: unless-stopped

volumes:
  postgres_data:
